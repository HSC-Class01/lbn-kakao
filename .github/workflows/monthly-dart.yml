name: KAKAO DART Monthly Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monthly-dart.yml'
      - 'agent.py'
      - 'test_agent.py'
      - 'requirements.txt'
      - 'metrics.json'
      - 'peers.json'
      - 'template.html'
      - 'overrides.csv'
      - 'dashboard-badge.svg'
  schedule:
    - cron: '15 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kakao-dart-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest test_agent -v
      - name: Collect DART data and build dashboard
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DART_API_KEY:-}" ]]; then
            python agent.py
          else
            echo "DART_API_KEY is not configured; building dashboard with the current data snapshot."
            python agent.py --build-only
          fi
      - name: Validate generated dashboard and data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          records = json.loads(Path("data/financials.json").read_text(encoding="utf-8")) if Path("data/financials.json").exists() else []
          status = json.loads(Path("data/status.json").read_text(encoding="utf-8")) if Path("data/status.json").exists() else {}
          html = Path("docs/index.html").read_text(encoding="utf-8")
          assert isinstance(records, list), "financials.json must contain a list"
          assert "__PAYLOAD__" not in html, "dashboard payload was not rendered"
          assert "KAKAO" in html and "035720" in html, "dashboard identity is missing"
          print(f"Dashboard validated: {len(records)} records; updated_at={status.get('updated_at')}")
          PY
      - name: Commit data snapshot and dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Kakao DART dashboard"
            branch="${{ github.event.repository.default_branch }}"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin "$branch"
              if ! git rebase "origin/$branch"; then
                git rebase --abort
                echo "Could not rebase the generated snapshot; rerun against the latest branch."
                exit 1
              fi
              if git push origin "HEAD:$branch"; then
                pushed=true
                break
              fi
              sleep $((attempt * 2))
            done
            if [[ "$pushed" != true ]]; then
              echo "Could not push the snapshot after three attempts."
              exit 1
            fi
          fi
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live dashboard
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request

          url = os.environ["PAGE_URL"].rstrip("/") + "/"
          last_error = None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      html = response.read().decode("utf-8")
                      if response.status == 200 and "<title>KAKAO" in html and "035720" in html and "__PAYLOAD__" not in html:
                          print(f"Live dashboard verified: {url} ({len(html)} bytes)")
                          break
                      last_error = f"Unexpected response: HTTP {response.status}"
              except (urllib.error.URLError, TimeoutError) as exc:
                  last_error = str(exc)
              if attempt < 11:
                  time.sleep(10)
          else:
              raise SystemExit(f"Live dashboard verification failed: {last_error}")
          PY
      - name: Checkout for deployment status
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Record verified deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          status_path = Path("data/status.json")
          status = json.loads(status_path.read_text(encoding="utf-8")) if status_path.exists() else {}
          report = {
              "verified_at": datetime.now(timezone.utc).isoformat(),
              "page_url": os.environ["PAGE_URL"],
              "source_sha": os.environ["SOURCE_SHA"],
              "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
              "data_updated_at": status.get("updated_at"),
          }
          Path("deployment-status.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status.json
          git commit -m "deploy: record verified Kakao dashboard"
          branch="${{ github.event.repository.default_branch }}"
          git fetch origin "$branch"
          if ! git rebase "origin/$branch"; then
            git rebase --abort
            echo "Could not rebase the deployment verification record."
            exit 1
          fi
          git push origin "HEAD:$branch"
