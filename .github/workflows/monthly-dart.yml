name: KAKAO DART Monthly Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monthly-dart.yml'
      - 'agent.py'
      - 'test_agent.py'
      - 'requirements.txt'
      - 'metrics.json'
      - 'peers.json'
      - 'template.html'
      - 'overrides.csv'
      - 'dashboard-badge.svg'
  schedule:
    - cron: '15 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kakao-dart-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest test_agent -v
      - name: Collect DART data and build dashboard
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DART_API_KEY:-}" ]]; then
            python agent.py
          else
            echo "DART_API_KEY is not configured; building dashboard with the current data snapshot."
            python agent.py --build-only
          fi
      - name: Validate generated dashboard and data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          records = json.loads(Path("data/financials.json").read_text(encoding="utf-8")) if Path("data/financials.json").exists() else []
          status = json.loads(Path("data/status.json").read_text(encoding="utf-8")) if Path("data/status.json").exists() else {}
          html = Path("docs/index.html").read_text(encoding="utf-8")
          assert isinstance(records, list), "financials.json must contain a list"
          assert "__PAYLOAD__" not in html, "dashboard payload was not rendered"
          assert "KAKAO" in html and "035720" in html, "dashboard identity is missing"
          print(f"Dashboard validated: {len(records)} records; updated_at={status.get('updated_at')}")
          PY
      - name: Commit data snapshot and dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Kakao DART dashboard"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
